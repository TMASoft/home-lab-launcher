name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch/PR so pushes in quick succession
# do not queue redundant builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Release file hygiene check
        run: npm run release:check

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Dependency audit
        run: npm run audit:ci

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Compose config
        env:
          SESSION_SECRET: ci-session-secret-for-compose-validation-only
          HOST_PORT: '18080'
          PUBLIC_READ_ENABLED: 'false'
        run: docker compose config

      - name: Docker build
        run: docker build -t home-lab-launcher:ci .

      - name: Container startup smoke test
        env:
          APP_IMAGE: home-lab-launcher:ci
          SESSION_SECRET: ci-session-secret-for-container-smoke-test-only
          HOST_PORT: '18080'
          HOST_BIND_IP: 127.0.0.1
          APP_BASE_URL: http://127.0.0.1:18080
          PUBLIC_READ_ENABLED: 'false'
        run: |
          # Reuse the image built above instead of rebuilding through Compose.
          docker compose up -d --no-build
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18080/api/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        env:
          APP_IMAGE: home-lab-launcher:ci
          SESSION_SECRET: ci-session-secret-for-compose-cleanup-only
          HOST_PORT: '18080'
          HOST_BIND_IP: 127.0.0.1
          APP_BASE_URL: http://127.0.0.1:18080
          PUBLIC_READ_ENABLED: 'false'
        run: docker compose down -v
